# learninglog-kit 설정 파일
# 문서: https://github.com/your-repo/learninglog-kit/docs/llm-providers.md

project:
  name: "My Learning Log"
  language: "ko"            # 기본 언어 (ko / en)

paths:
  inbox:    "00_inbox"
  registry: "01_registry/source_registry.csv"
  extracted: "02_extracted"
  working:   "03_working_notes"
  drafts:    "04_blog_drafts"
  reports:   "09_reports"

# ──────────────────────────────────────────────────────────
# LLM 설정
#
# provider 를 하나 선택하고 해당 섹션에 api_key 를 입력하세요.
#
#  무료:
#    gemini  → Google AI Studio  https://aistudio.google.com
#    groq    → Groq Console      https://console.groq.com
#    ollama  → 로컬 실행          https://ollama.com
#
#  유료:
#    claude  → Anthropic          https://console.anthropic.com
#    openai  → OpenAI             https://platform.openai.com
#
#  없음:
#    none    → intake / queue 만 사용 가능
# ──────────────────────────────────────────────────────────
llm:
  provider: "none"          # 위 목록 중 하나로 변경

  ollama:
    host:    "http://127.0.0.1:11434"
    model:   "llama3.2:3b"
    num_ctx: 4096          # 실행 컨텍스트. 글이 잘리면 8192 로 ↑ (GPU VRAM 부족 시 2048 ↓)
    num_predict: 2048      # 한 번에 생성할 최대 출력 토큰 (글 잘림 방지). num_ctx 보다 작아야 함

  gemini:
    api_key: ""             # 또는 환경변수 GEMINI_API_KEY
    model:   "gemini-2.5-flash"

  groq:
    api_key: ""             # 또는 환경변수 GROQ_API_KEY
    model:   "llama-3.1-8b-instant"

  claude:
    api_key: ""             # 또는 환경변수 ANTHROPIC_API_KEY
    model:   "claude-haiku-4-5"

  openai:
    api_key: ""             # 또는 환경변수 OPENAI_API_KEY
    model:   "gpt-4o-mini"

# ──────────────────────────────────────────────────────────
# 블로그 연동 (선택) — learninglog publish 가 사용
# ──────────────────────────────────────────────────────────
blog:
  platform:       "none"        # hugo | jekyll | none
  source_path:    "../blog-source"  # 블로그 소스 폴더 경로
  github_repo_url: ""           # 예: https://github.com/me/my-blog
  pages_url:       ""           # 예: https://me.github.io/
  content_subdir: "content"     # 글이 들어갈 하위 폴더 (hugo=content)
  auto_build:     true          # publish 시 hugo 빌드 실행
  auto_push:      false         # true 로 바꾸면 git add/commit/push 자동
  #
  # 발행 동작:
  #   04_blog_drafts/{section}/*.md
  #     → draft:false 변환, source_id 제거, ai_assisted:true 마킹
  #     → {source_path}/{content_subdir}/{section}/ 으로 복사
  #     → (auto_build) hugo 빌드  → (auto_push) git push
  #
  # 주의: public submodule / GitHub Actions 등 고급 배포는
  #       auto_push=false 로 두고 블로그 폴더에서 직접 배포하세요.
